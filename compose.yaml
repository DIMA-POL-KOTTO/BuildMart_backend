services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:?Set MEMCACHED_SERVERS in .env.docker}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ADMIN123}
    ports:
      - "8081:8080"
    depends_on:
      memcached:
        condition: service_started
    command: ["sh", "-c", "npx prisma migrate deploy --config ./prisma7.config.ts && node scripts/create-admin.js && npm start"]
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "64"]