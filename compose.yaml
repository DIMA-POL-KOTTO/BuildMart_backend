services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: buildmart
      MYSQL_USER: buildmart_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - buildmart_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS:?Set MEMCACHED_SERVERS in .env.docker}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "64"]
volumes:
  buildmart_db_data: